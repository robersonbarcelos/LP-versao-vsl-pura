<style>
  /* Hero VSL — centralizado, sem split layout */
  .hero--vsl {
    padding: 12px 0 40px !important;
    min-height: unset !important;
    display: block !important;
    text-align: center;
  }
  .hero--vsl .hero-bleed-grid { display: none; }

  .hero--vsl .hero-pillars { display: none; }
  .hero--vsl .container { position: relative; z-index: 2; }
  .hero-vsl-content {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .hero-vsl-content .hero-title {
    font-size: clamp(36px, 4.8vw, 72px);
    text-align: center;
    margin: 0;
  }
  /* Botão grande com texto longo */
  .hero-vsl-cta {
    margin-top: 0;
    padding: 22px 48px;
    font-size: clamp(15px, 1.4vw, 18px);
    white-space: normal;
    text-align: center;
    max-width: 560px;
    line-height: 1.4;
    border-radius: 999px;
  }

  /* VSL pura — sem título acima */
  .vsl--pura { padding: clamp(40px, 6vw, 80px) 0; }
  .vsl--pura .vsl-hd { display: none; }

  /* Proof — seção escura separada */
  .proof-section { background: #0a0a0a; padding: var(--pad-section) 0; }

  /* Offer — cinza claro suave */
  section#oferta { background: #ebeaea; }

  /* FAQ — cinza um tom mais escuro */
  section#faq { background: #E5E5E8; }
  section#faq .section-eyebrow { color: #7a2600; border-color: rgba(122,38,0,.4); background: rgba(122,38,0,.08); }
  section#faq .section-eyebrow::before { display: none; }
  section#faq .h2 { color: #0a0a0a; }
  section#faq .faq-item { border-color: rgba(0,0,0,.12); }
  section#faq .faq-q { color: #0a0a0a; background: none; }
  section#faq .faq-q span { color: #0a0a0a; }
  section#faq .faq-icon { background: transparent !important; border: 2px solid #0a0a0a !important; color: #0a0a0a !important; }
  section#faq .faq-item.open .faq-icon { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
  section#faq .faq-a,
  section#faq .faq-a-inner { color: rgba(10,10,10,.75); }

  /* Proof hero — full-bleed igual à hero */
  .proof-hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 560px;
    margin-bottom: 64px;
    position: relative;
    overflow: hidden;
  }
  .proof-hero-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    padding: 64px 48px 64px clamp(20px, 4vw, 48px);
    position: relative;
    z-index: 2;
  }
  .proof-hero-title {
    font-size: clamp(32px, 3.2vw, 52px);
    margin: 16px 0 0;
  }
  .proof-hero-img {
    position: relative;
    overflow: hidden;
  }
  .proof-hero-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
    display: block;
    mask-image:
      linear-gradient(to right, transparent 0%, rgba(0,0,0,.2) 12%, black 35%, black 80%, transparent 100%),
      linear-gradient(transparent 0%, black 8%, black 92%, transparent 100%);
    mask-composite: intersect;
  }
