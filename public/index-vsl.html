<!-- CSS extra só pra versão VSL pura -->
<style>
  /* Hero VSL — centralizado, sem split layout */
  .hero--vsl {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(16px, 2vw, 28px) 0 clamp(24px, 3vw, 40px);
  }
  .hero--vsl .container { position: relative; z-index: 2; }
  .hero-vsl-content {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .hero-vsl-content .hero-title {
    font-size: clamp(36px, 4.8vw, 72px);
    text-align: center;
    margin: 0;
  }
  /* Botão grande com texto longo */
  .hero-vsl-cta {
    margin-top: 0;
    padding: 22px 48px;
    font-size: clamp(15px, 1.4vw, 18px);
    white-space: normal;
    text-align: center;
    max-width: 560px;
    line-height: 1.4;
    border-radius: 999px;
  }

  /* VSL pura — sem título acima */
  .vsl--pura { padding: clamp(40px, 6vw, 80px) 0; }
  .vsl--pura .vsl-hd { display: none; }

  /* Oferta: bloco de prova acima do card */
  .offer-proof {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-bottom: 56px;
    padding: 40px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
  }
  .offer-proof img {
    width: 240px;
    height: 240px;
    object-fit: cover;
    border-radius: var(--r);
    flex-shrink: 0;
  }
  .offer-proof-caption { display: flex; flex-direction: column; gap: 12px; }
  .offer-proof-caption p {
    font-size: clamp(18px, 1.8vw, 24px);
    font-weight: 700;
    color: var(--ink);
    margin: 0;
    line-height: 1.3;
  }
  @media (max-width: 640px) {
    .offer-proof { flex-direction: column; gap: 24px; padding: 24px; }
    .offer-proof img { width: 100%; height: auto; max-height: 280px; }
  }
</style>
