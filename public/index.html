s: center; gap: 10px; padding: 16px 26px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: 15px; font-family: var(--f-body); transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap; position: relative; overflow: hidden; }.btn-primary { background: radial-gradient(67.54% 100.03% at 50% 0%, rgb(255, 96, 32) 0%, rgb(232, 64, 0) 25%, rgb(192, 48, 0) 62%, rgb(140, 32, 0) 100%); color: rgb(255, 255, 255); border: 1.2px solid rgba(232, 64, 0, 0.22); box-shadow: rgba(232, 64, 0, 0.22) 0px 6px 23px, rgba(232, 64, 0, 0.45) 0px 14px 54px; }.nav { position: sticky; top: 0px; z-index: 50; transition: background 0.3s, border-color 0.3s; border-bottom: 1px solid transparent; }.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -0.03em; display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase; }.wa-float { position: fixed; bottom: 28px; right: 28px; z-index: 9000; width: 58px; height: 58px; border-radius: 50%; background: rgb(37, 211, 102); display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255); box-shadow: rgba(37, 211, 102, 0.45) 0px 4px 20px; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; }.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s cubic-bezier(0.2, 0.6, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.6, 0.2, 1); transition-delay: var(--reveal-delay, 0ms); }@media (max-width: 540px){:root { --pad-section: clamp(44px, 7vw, 64px); }.wa-float { bottom: 16px; right: 16px; width: 50px; height: 50px; }}/*CRITICAL-CSS-END*/</style>

<!-- CSS extra só pra versão VSL pura -->
<style>
  /* Hero VSL — centralizado, sem split layout */
  .hero--vsl {
    padding: 12px 0 40px !important;
    min-height: unset !important;
    display: block !important;
    text-align: center;
  }
  .hero--vsl .hero-bleed-grid { display: none; }
  .hero--vsl .hero-bullets-below { display: none; }
  .hero--vsl .hero-pillars { display: none; }
  .hero--vsl .container { position: relative; z-index: 2; }
  .hero-vsl-content {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .hero-vsl-content .hero-title {
    font-size: clamp(36px, 4.8vw, 72px);
    text-align: center;
    margin: 0;
  }
  /* Botão grande com texto longo */
  .hero-vsl-cta {
    margin-top: 0;
    padding: 22px 48px;
    font-size: clamp(15px, 1.4vw, 18px);
    white-space: normal;
    text-align: center;
    max-width: 560px;
    line-height: 1.4;
    border-radius: 999px;
  }

  /* VSL pura — sem título acima */
  .vsl--pura { padding: clamp(40px, 6vw, 80px) 0; }
  .vsl--pura .vsl-hd { display: none; }

  /* Proof — seção escura separada */
  .proof-section { background: #0a0a0a; padding: var(--pad-section) 0; }

  /* Offer — cinza claro suave */
  section#oferta { background: #ebeaea; }

  /* FAQ — cinza um tom mais escuro */
  section#faq { background: #E5E5E8; }
  section#faq .section-eyebrow { color: var(--accent); }
  section#faq .h2 { color: #0a0a0a; }
  section#faq .faq-item { border-color: rgba(0,0,0,.12); }
  section#faq .faq-q { color: #0a0a0a; background: none; }
  section#faq .faq-q span { color: #0a0a0a; }
  section#faq .faq-icon { background: transparent !important; border: 2px solid #0a0a0a !important; color: #0a0a0a !important; }
  section#faq .faq-item.open .faq-icon { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
  section#faq .faq-a,
  section#faq .faq-a-inner { color: rgba(10,10,10,.75); }

  /* Proof hero — full-bleed igual à hero */
  .proof-hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 560px;
    margin-bottom: 64px;
    position: relative;
    overflow: hidden;
  }
  .proof-hero-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    padding: 64px 48px 64px clamp(20px, 4vw, 48px);
    position: relative;
    z-index: 2;
  }
  .proof-hero-title {
    font-size: clamp(32px, 3.2vw, 52px);
    margin: 16px 0 0;
  }
  .proof-hero-img {
    position: relative;
    overflow: hidden;
  }
  .proof-hero-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
    display: block;
    mask-image:
      linear-gradient(to right, transparent 0%, rgba(0,0,0,.2) 12%, black 35%, black 80%, transparent 100%),
      linear-gradient(transparent 0%, black 8%, black 92%, transparent 100%);
    mask-composite: intersect;
  }
  @media (max-width: 920px) {
    .proof-hero { grid-template-columns: 1fr; }
    .proof-hero-img { min-height: 72vw; max-height: 440px; }
    .proof-hero-img img {
      object-position: center 20%;
      mask-image: linear-gradient(black 60%, transparent 100%);
    }
  }
</style>
